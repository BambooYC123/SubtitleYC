[project]
name = "subtitleyc"
version = "0.5.0"
description = "Open-source Windows app for extracting, reviewing, and editing subtitles from burned-in video captions."
readme = "README.md"
requires-python = ">=3.10"
license = { file = "LICENSE" }
authors = [
    { name = "EricYC123" },
]
classifiers = [
    "License :: OSI Approved :: MIT License",
    "Operating System :: Microsoft :: Windows",
    "Programming Language :: Python :: 3",
    "Topic :: Multimedia :: Video",
]
dependencies = [
    "av>=17,<18",
    "pillow>=12.3,<13",
    "fastapi>=0.115,<1",
    "pydantic>=2,<3",
    "python-multipart>=0.0.9,<1",
    "pycryptodomex>=3.20,<4",
    "PySide6>=6.11.1,<6.12",
    "pywebview>=6.2.1,<7",
    "uvicorn[standard]>=0.30,<1",
    "yt-dlp>=2026.7.4",
]

[project.urls]
Homepage = "https://github.com/BambooYC123/SubtitleYC"
Repository = "https://github.com/BambooYC123/SubtitleYC"
Issues = "https://github.com/BambooYC123/SubtitleYC/issues"

[project.optional-dependencies]
dev = [
    "httpx2>=2,<3",
    "pytest>=8,<9",
    "ruff>=0.8,<1",
]
build = [
    "pip-audit>=2.9,<3",
    "pip-tools>=7.5,<8",
    "pyinstaller>=6.21,<7",
]

[project.scripts]
subtitleyc = "subtitleyc.desktop:run"
subtitleyc-server = "subtitleyc.main:run"

[build-system]
requires = ["setuptools>=69", "wheel"]
build-backend = "setuptools.build_meta"

[tool.setuptools.packages.find]
include = ["subtitleyc*"]
