<!doctype html>
<html lang="en" data-theme="dark">
  <head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1" />
    <title>SubtitleYC Editor</title>
    <link rel="icon" type="image/png" href="/assets/SubtitleYC.png?v=20260705-02" />
    <link rel="stylesheet" href="/assets/ui.css?v=0.7.0" />
    <link rel="stylesheet" href="/assets/editor.css?v=0.7.0" />
  </head>
  <body>
    <main class="app-shell editor-shell">
      <header class="app-bar">
        <img class="brand-mark" src="/assets/SubtitleYC.png?v=20260705-02" alt="" aria-hidden="true" />
        <nav class="mode-tabs" role="tablist" aria-label="Mode">
          <button id="modeExtractButton" type="button" role="tab" aria-selected="false">Extract</button>
          <button id="modeEditButton" type="button" role="tab" aria-selected="true">Edit</button>
        </nav>
        <strong id="videoTitle" class="bar-file">No video loaded</strong>
        <span class="bar-spacer"></span>
        <span id="cueMeta" class="bar-state">SRT</span>
        <input id="videoInput" type="file" accept="video/*" hidden />
        <button id="videoUploadButton" type="button" data-editor-tooltip="Open a video" data-shortcut="Ctrl+L">Open Video</button>
        <button id="previousButton" type="button">Library</button>
        <div class="menu-wrap">
          <button id="moreButton" class="btn-icon" type="button" aria-haspopup="true" aria-expanded="false" title="More" aria-label="More">
            <svg class="button-icon" viewBox="0 0 24 24" aria-hidden="true"><circle cx="5" cy="12" r="1.4" /><circle cx="12" cy="12" r="1.4" /><circle cx="19" cy="12" r="1.4" /></svg>
          </button>
          <div id="moreMenu" class="menu" hidden>
            <button id="uploadButton" type="button" disabled>Upload Subtitles <small data-i18n-skip>Ctrl+U</small></button>
            <button id="reloadButton" type="button" data-shortcut="Ctrl+R">Reload <small data-i18n-skip>Ctrl+R</small></button>
            <label class="menu-check"><input id="videoKeepCopyInput" type="checkbox" /> Keep copy</label>
            <hr />
            <button id="removeEditorSubtitlesButton" type="button" disabled>Remove Subtitles</button>
            <button id="removeEditorVideoButton" type="button" disabled>Remove Video</button>
          </div>
        </div>
      </header>

      <section class="editor-grid">
        <section class="pane viewer" aria-label="Video preview">
          <div class="pane-head">
            <b>Viewer</b>
            <span id="videoSpecs" data-i18n-skip></span>
          </div>
          <div class="video-frame stage">
            <video id="editorVideo" preload="metadata" playsinline></video>
            <img id="editorFrameFallback" class="frame-fallback" alt="" hidden />
            <div id="subtitleOverlay" class="subtitle-overlay" data-i18n-skip hidden></div>
          </div>
          <div class="transport">
            <button id="prevSubtitleButton" class="glyph" type="button" aria-label="Previous subtitle" data-editor-tooltip="Jump to the previous subtitle boundary" data-shortcut="Shift+Left" disabled>
              <svg class="button-icon" viewBox="0 0 24 24" aria-hidden="true"><path d="M6 5v14" /><path d="M19 5 9 12l10 7z" fill="currentColor" /></svg>
            </button>
            <button id="prevFrameButton" class="glyph" type="button" aria-label="Previous frame" data-editor-tooltip="Move back one frame" data-shortcut="Left Arrow" disabled>
              <svg class="button-icon" viewBox="0 0 24 24" aria-hidden="true"><path d="M17 5 7 12l10 7z" fill="currentColor" /></svg>
            </button>
            <button id="playButton" class="play" type="button" data-editor-tooltip="Play or pause the video" data-shortcut="Space" disabled>Play</button>
            <button id="nextFrameButton" class="glyph" type="button" aria-label="Next frame" data-editor-tooltip="Move forward one frame" data-shortcut="Right Arrow" disabled>
              <svg class="button-icon" viewBox="0 0 24 24" aria-hidden="true"><path d="m7 5 10 7-10 7z" fill="currentColor" /></svg>
            </button>
            <button id="nextSubtitleButton" class="glyph" type="button" aria-label="Next subtitle" data-editor-tooltip="Jump to the next subtitle boundary" data-shortcut="Shift+Right" disabled>
              <svg class="button-icon" viewBox="0 0 24 24" aria-hidden="true"><path d="M18 5v14" /><path d="m5 5 10 7-10 7z" fill="currentColor" /></svg>
            </button>
            <span id="timeIndicator" class="timecode" data-i18n-skip><span id="timeCurrent">00:00.000</span><small id="timeTotal">/ 00:00.000</small></span>
            <span class="frame-readout"><span>Frame</span> <b id="frameCurrent" data-i18n-skip>0</b> / <span id="frameTotal" data-i18n-skip>0</span></span>
            <span class="transport-end">
              <button id="undoButton" type="button" data-editor-tooltip="Undo subtitle edit" data-shortcut="Ctrl+Z" disabled>Undo</button>
              <button id="redoButton" type="button" data-editor-tooltip="Redo subtitle edit" data-shortcut="Ctrl+Y / Ctrl+Shift+Z" disabled>Redo</button>
            </span>
          </div>
          <div class="timeline">
            <div id="timeline" class="tl">
              <div class="tl-ruler"></div>
              <div class="tl-track">
                <input id="seekSlider" class="tl-seek" type="range" min="0" max="0" step="0.001" value="0" aria-label="Seek" disabled />
              </div>
            </div>
          </div>
        </section>

        <aside class="pane cue-pane" aria-label="Subtitle cues">
          <div class="pane-head">
            <b>Subtitles</b>
            <span id="cueCount">0 cues</span>
            <span class="head-spacer"></span>
            <span id="cueIssues" class="cue-issues" hidden></span>
          </div>
          <div class="find-bar">
            <input id="findInput" type="search" placeholder="Find in subtitles" aria-label="Find in subtitles" autocomplete="off" />
            <button id="replaceToggleButton" type="button" aria-expanded="false" aria-controls="replaceBar">Replace</button>
            <input id="subtitleImportInput" type="file" accept=".srt" hidden />
            <button id="addCueButton" type="button" data-editor-tooltip="Add a cue at the playhead">Add</button>
            <button id="deleteCueButton" type="button" data-editor-tooltip="Delete the selected cue" data-shortcut="Delete" disabled>Delete</button>
          </div>
          <div id="replaceBar" class="find-bar" hidden>
            <input id="replaceInput" type="text" placeholder="Replace with" aria-label="Replace with" autocomplete="off" />
            <button id="replaceAllButton" type="button">Replace all</button>
          </div>
          <div class="cue-grid cue-grid-head" aria-hidden="true"><span>#</span><span>Time</span><span>Text</span></div>
          <div id="cueList" class="cue-list" role="listbox" aria-label="Subtitle cue list"></div>

          <form id="cueForm" class="cue-form">
            <div class="time-fields">
              <div class="field">
                <span>Start</span>
                <div class="stepper">
                  <button id="visibleStartBackButton" type="button" aria-label="Move start earlier" disabled>−</button>
                  <input id="startInput" type="text" inputmode="decimal" aria-label="Start" autocomplete="off" />
                  <button id="visibleStartForwardButton" type="button" aria-label="Move start later" disabled>+</button>
                </div>
              </div>
              <div class="field">
                <span>End</span>
                <div class="stepper">
                  <button id="visibleEndBackButton" type="button" aria-label="Move end earlier" disabled>−</button>
                  <input id="endInput" type="text" inputmode="decimal" aria-label="End" autocomplete="off" />
                  <button id="visibleEndForwardButton" type="button" aria-label="Move end later" disabled>+</button>
                </div>
              </div>
              <div class="field">
                <span>Duration</span>
                <input id="durationOutput" type="text" aria-label="Duration" readonly tabindex="-1" data-i18n-skip />
              </div>
              <label class="field" title="Frames moved by each − and + press">
                <span>Frames</span>
                <input id="frameStepInput" type="number" min="0.25" max="60" step="0.25" value="1" />
              </label>
            </div>
            <textarea id="textInput" rows="3" placeholder="Subtitle text" data-i18n-skip></textarea>
            <div id="subtitleStyleToolbar" class="subtitle-style-toolbar" role="toolbar" aria-label="Subtitle text style" title="Select text to style it, or leave nothing selected to style the whole cue.">
              <button id="boldStyleButton" class="subtitle-style-button" type="button" data-editor-tooltip="Bold selected text" data-shortcut="Ctrl+B" aria-label="Bold" aria-pressed="false"><strong>B</strong></button>
              <button id="italicStyleButton" class="subtitle-style-button" type="button" data-editor-tooltip="Italicize selected text" data-shortcut="Ctrl+I" aria-label="Italic" aria-pressed="false"><em>I</em></button>
              <button id="underlineStyleButton" class="subtitle-style-button" type="button" data-editor-tooltip="Underline selected text" data-shortcut="Ctrl+U" aria-label="Underline" aria-pressed="false"><u>U</u></button>
              <label class="subtitle-color-control" data-editor-tooltip="Choose the selected text color">
                <span>Color</span>
                <input id="textColorInput" type="color" value="#ffffff" aria-label="Text color" />
              </label>
              <button id="clearStyleButton" class="subtitle-clear-style" type="button" data-editor-tooltip="Remove formatting from selected text">Clear Style</button>
              <span id="cueStats" class="cue-stats"></span>
            </div>
          </form>
        </aside>
      </section>

      <footer class="status-bar has-actions">
        <span id="editorStatus" class="status-text">Loading</span>
        <div class="bottom-actions">
          <button id="saveButton" type="button" data-editor-tooltip="Save subtitle changes" data-shortcut="Ctrl+S" disabled>
            <svg class="button-icon" viewBox="0 0 24 24" aria-hidden="true"><path d="M5 4h11l3 3v13H5z" /><path d="M8 4v5h7" /><path d="M8 20v-6h8v6" /></svg>
            <span class="big-label"><b>Save</b><small id="saveNote">No unsaved changes</small></span>
          </button>
          <button id="downloadButton" class="btn-primary" type="button" disabled>
            <svg class="button-icon" viewBox="0 0 24 24" aria-hidden="true"><path d="M12 3v12" /><path d="M7 10l5 5 5-5" /><path d="M5 21h14" /></svg>
            <span class="big-label"><b>Export</b><small id="downloadNote">Nothing to export yet</small></span>
          </button>
        </div>
      </footer>
    </main>
    <div id="libraryOverlay" class="editor-overlay" hidden></div>
    <aside id="libraryDrawer" class="editor-library-drawer" aria-hidden="true" aria-label="Previous Projects" hidden>
      <div class="editor-drawer-header">
        <div>
          <h2>Previous Projects</h2>
          <p>Open a copied video, or attach timed subtitles to the current video</p>
        </div>
        <button id="libraryCloseButton" class="section-toggle" type="button">Close</button>
      </div>
      <div class="editor-drawer-toolbar">
        <button id="libraryRefreshButton" type="button">Refresh</button>
        <span id="libraryMeta">0 previous project files</span>
      </div>
      <section class="editor-library-section" aria-labelledby="libraryVideosHeading">
        <h3 id="libraryVideosHeading">Previous Videos</h3>
        <div id="libraryVideoList" class="editor-library-list"></div>
      </section>
      <section class="editor-library-section" aria-labelledby="librarySubtitlesHeading">
        <h3 id="librarySubtitlesHeading">Previous Subtitles</h3>
        <div id="librarySubtitleList" class="editor-library-list"></div>
      </section>
    </aside>
    <div id="editorTooltip" class="editor-tooltip" role="tooltip" data-i18n-skip hidden>
      <span id="editorTooltipText"></span>
      <kbd id="editorTooltipShortcut" hidden></kbd>
    </div>
    <script src="/assets/i18n.js?v=0.7.0"></script>
    <script src="/assets/save-coordinator.js?v=0.7.0"></script>
    <script src="/assets/preview-overlays.js?v=0.7.0"></script>
    <script src="/assets/timeline.js?v=0.7.0"></script>
    <script src="/assets/editor.js?v=0.7.0"></script>
  </body>
</html>
